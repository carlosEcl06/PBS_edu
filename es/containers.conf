# Imágenes de contenedor usadas en el curso, una etiqueta (tag) fijada por herramienta.
#
# Las etiquetas vienen de https://quay.io/organization/biocontainers (las imágenes
# detrás de bioconda). Nunca uses ":latest": no podrías reproducir tus resultados
# más adelante. Para cambiar una herramienta, edita su etiqueta aquí, borra
# sif/<herramienta>.sif y vuelve a ejecutar 00_getting_started/pull_containers.sh.
#
# El nombre de la variable es IMG_<herramienta>; el nombre de la herramienta es también el del .sif.

IMG_seqkit="quay.io/biocontainers/seqkit:2.13.0--he881be0_0"
IMG_fastqc="quay.io/biocontainers/fastqc:0.12.1--hdfd78af_0"
IMG_fastp="quay.io/biocontainers/fastp:1.3.6--h43da1c4_0"
IMG_minimap2="quay.io/biocontainers/minimap2:2.31--h118bc1c_0"
IMG_samtools="quay.io/biocontainers/samtools:1.24--h9dcdb79_1"
IMG_wgsim="quay.io/biocontainers/wgsim:1.0--h577a1d6_10"

TOOLS=(seqkit fastqc fastp minimap2 samtools wgsim)
