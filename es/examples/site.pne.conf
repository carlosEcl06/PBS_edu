# Ejemplo real: el site.conf del pequeño cluster de laboratorio donde se escribió
# este curso (un nodo de login, varios nodos de cómputo, una cola por defecto
# llamada "workq", datos en un disco aparte /data2). Tus valores serán otros.
#
# Está aquí solo para mostrar cómo se ve un site.conf completo.

EDU_QUEUE="workq"

DATA_DIR="/data2/projects/pbs_edu/data"
WORKDIR="/data2/projects/pbs_edu/work"
SIF_CACHE="/data2/projects/pbs_edu/sif"

CONTAINER_RUNTIME="apptainer"
BIND_PATHS="/data2"

N_SAMPLES=6
READS_PER_SAMPLE=300000
