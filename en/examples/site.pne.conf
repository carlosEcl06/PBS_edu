# Worked example: the site.conf of the small lab cluster this course was first
# written on (one login node, several compute nodes, a default queue named
# "workq", data on a separate /data2 disk). Your values will differ.
#
# It is here only to show what a filled-in site.conf looks like.

EDU_QUEUE="workq"

DATA_DIR="/data2/projects/pbs_edu/data"
WORKDIR="/data2/projects/pbs_edu/work"
SIF_CACHE="/data2/projects/pbs_edu/sif"

CONTAINER_RUNTIME="apptainer"
BIND_PATHS="/data2"

N_SAMPLES=6
READS_PER_SAMPLE=300000
