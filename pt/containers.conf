# Imagens de container usadas no curso, uma tag fixada por ferramenta.
#
# As tags vêm de https://quay.io/organization/biocontainers (as imagens por trás
# do bioconda). Nunca use ":latest": você não conseguiria reproduzir seus
# resultados depois. Para trocar uma ferramenta, edite a tag aqui, apague
# sif/<ferramenta>.sif e rode de novo 00_getting_started/pull_containers.sh.
#
# O nome da variável é IMG_<ferramenta>; o nome da ferramenta é também o nome do .sif.

IMG_seqkit="quay.io/biocontainers/seqkit:2.13.0--he881be0_0"
IMG_fastqc="quay.io/biocontainers/fastqc:0.12.1--hdfd78af_0"
IMG_fastp="quay.io/biocontainers/fastp:1.3.6--h43da1c4_0"
IMG_minimap2="quay.io/biocontainers/minimap2:2.31--h118bc1c_0"
IMG_samtools="quay.io/biocontainers/samtools:1.24--h9dcdb79_1"
IMG_wgsim="quay.io/biocontainers/wgsim:1.0--h577a1d6_10"

TOOLS=(seqkit fastqc fastp minimap2 samtools wgsim)
