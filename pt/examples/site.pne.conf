# Exemplo real: o site.conf do pequeno cluster de laboratório onde este curso foi
# escrito (um nó de login, vários nós de computação, uma fila padrão chamada
# "workq", dados num disco separado /data2). Os seus valores serão outros.
#
# Está aqui só para mostrar como fica um site.conf preenchido.

EDU_QUEUE="workq"

DATA_DIR="/data2/projects/pbs_edu/data"
WORKDIR="/data2/projects/pbs_edu/work"
SIF_CACHE="/data2/projects/pbs_edu/sif"

CONTAINER_RUNTIME="apptainer"
BIND_PATHS="/data2"

N_SAMPLES=6
READS_PER_SAMPLE=300000
