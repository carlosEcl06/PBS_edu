# Images de conteneur utilisées dans le cours, une étiquette (tag) épinglée par outil.
#
# Les tags viennent de https://quay.io/organization/biocontainers (les images
# derrière bioconda). N'utilisez jamais ":latest" : vous ne pourriez pas
# reproduire vos résultats plus tard. Pour changer un outil, modifiez son tag
# ici, supprimez sif/<outil>.sif et relancez 00_getting_started/pull_containers.sh.
#
# Le nom de la variable est IMG_<outil> ; le nom de l'outil est aussi celui du .sif.

IMG_seqkit="quay.io/biocontainers/seqkit:2.13.0--he881be0_0"
IMG_fastqc="quay.io/biocontainers/fastqc:0.12.1--hdfd78af_0"
IMG_fastp="quay.io/biocontainers/fastp:1.3.6--h43da1c4_0"
IMG_minimap2="quay.io/biocontainers/minimap2:2.31--h118bc1c_0"
IMG_samtools="quay.io/biocontainers/samtools:1.24--h9dcdb79_1"
IMG_wgsim="quay.io/biocontainers/wgsim:1.0--h577a1d6_10"

TOOLS=(seqkit fastqc fastp minimap2 samtools wgsim)
