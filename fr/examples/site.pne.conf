# Exemple réel : le site.conf du petit cluster de laboratoire sur lequel ce cours a
# été écrit (un nœud de connexion, plusieurs nœuds de calcul, une file par défaut
# nommée "workq", des données sur un disque séparé /data2). Vos valeurs seront différentes.
#
# Il n'est là que pour montrer à quoi ressemble un site.conf rempli.

EDU_QUEUE="workq"

DATA_DIR="/data2/projects/pbs_edu/data"
WORKDIR="/data2/projects/pbs_edu/work"
SIF_CACHE="/data2/projects/pbs_edu/sif"

CONTAINER_RUNTIME="apptainer"
BIND_PATHS="/data2"

N_SAMPLES=6
READS_PER_SAMPLE=300000
